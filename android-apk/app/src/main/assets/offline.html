<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sin conexión</title>
  <style>
    :root { --bg-1:#071018; --bg-2:#0b1a2b; --cian:#00d4ff; --muted:#b8c7d9; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
      background:radial-gradient(circle at 30% 20%, #13263d 0%, var(--bg-2) 45%, var(--bg-1) 100%);
      color:#eaf2fa; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    }
    .card{
      width:min(100%,430px); background:linear-gradient(180deg,#16263a,#0f1c2e);
      border:1px solid #2a4a6a; border-radius:24px; padding:28px 24px; text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
    }
    .icon{width:88px;height:88px;margin:0 auto;border-radius:50%;background:#1e3550;border:1px solid #355c7d;padding:14px}
    .icon img{width:100%;height:100%;object-fit:contain;border-radius:50%}
    h1{margin-top:18px;font-size:1.45rem;font-weight:800}
    p{margin-top:10px;color:var(--muted);line-height:1.55;font-size:.96rem}
    .brand{margin-top:14px;color:var(--cian);font-size:.82rem;font-weight:600}
    .actions{display:flex;gap:10px;margin-top:22px}
    button{flex:1;height:48px;border:0;border-radius:14px;font-size:.95rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    button svg{width:18px;height:18px;fill:currentColor;flex:0 0 auto}
    .close{background:#334a63;color:#eaf2fa}
    .retry{background:linear-gradient(90deg,#00a8cc,#007ea7);color:#fff}
    button[disabled]{opacity:.75}
    .spin{animation:spin 1s linear infinite}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="card" id="offlineCard">
    <div class="icon"><img src="logo.png" alt="Logo UnicornioSoftware"></div>
    <h1><span style="display:inline-flex;align-items:center;gap:8px;"><svg viewBox="0 0 24 24" width="22" height="22" fill="#00d4ff" aria-hidden="true"><path d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.5 0-2.89.19-4.15.48L18.18 13.8 23.64 7zM17.04 15.22L3.27 1.44 2 2.72l2.05 2.06C1.91 5.76.59 6.82.36 7l11.63 14.49.01.01.01-.01 3.9-4.86 3.32 3.32 1.27-1.27-3.46-3.46z"/></svg>Sin conexión a internet</span></h1>
    <p id="offlineText">Esta aplicación necesita conexión a internet para funcionar.<br><br>Verifica tu Wi-Fi o datos móviles e inténtalo de nuevo.</p>
    <div class="brand">UnicornioSoftware</div>
    <div class="actions">
      <button class="close" id="btnClose"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>Cerrar</button>
      <button class="retry" id="btnRetry"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg><span>Reintentar</span></button>
    </div>
  </div>

  <div class="card" id="retryCard" style="display:none;">
    <div style="width:64px;height:64px;margin:0 auto;border-radius:50%;border:4px solid rgba(0,212,255,.18);border-top-color:#00d4ff;animation:spin 1s linear infinite;"></div>
    <h1 style="margin-top:18px;"><span style="display:inline-flex;align-items:center;gap:8px;"><svg viewBox="0 0 24 24" width="22" height="22" fill="#00d4ff" class="spin" aria-hidden="true"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>Reintentando conexión</span></h1>
    <p>Comprobando tu conexión a internet...</p>
    <div class="brand">UnicornioSoftware</div>
  </div>
  <script>
    var btnClose = document.getElementById('btnClose');
    var btnRetry = document.getElementById('btnRetry');
    var offlineCard = document.getElementById('offlineCard');
    var retryCard = document.getElementById('retryCard');
    btnClose.addEventListener('click', function () {
      if (window.AndroidApp && window.AndroidApp.closeApp) window.AndroidApp.closeApp(); else window.close();
    });
    btnRetry.addEventListener('click', function () {
      if (btnRetry.disabled) return;
      btnRetry.disabled = true;
      offlineCard.style.display = 'none';
      retryCard.style.display = 'block';
      setTimeout(function () {
        if (window.AndroidApp && window.AndroidApp.retryConnection) { window.AndroidApp.retryConnection(); }
        else { location.reload(); }
      }, 1200);
    });
  </script>
</body>
</html>
