name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json

      - name: Refresh APK rate snapshots
        env:
          ELTOQUE_API_TOKEN: ${{ secrets.ELTOQUE_API_TOKEN }}
        run: php api/exchange-rate.php --write-dist || echo "No se pudieron refrescar snapshots de tasas; se conservan los existentes"

      - name: Install Android SDK components
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-apk
        run: gradle assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p android-apk/dist
          cp android-apk/app/build/outputs/apk/debug/app-debug.apk android-apk/dist/EcosisUnicorn.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcosisUnicorn-apk
          path: android-apk/dist/EcosisUnicorn.apk
          if-no-files-found: error

      - name: Commit updated APK to dist
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f android-apk/dist/EcosisUnicorn.apk android-apk/dist/rates.json android-apk/dist/rate-usd.json
          if git diff --cached --quiet; then
            echo "No APK changes to commit"
            exit 0
          fi
          git commit -m "Actualizar APK dist y snapshots de tasas [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main; then
              break
            fi
            if git status --porcelain | grep -q "android-apk/dist/EcosisUnicorn.apk"; then
              git checkout --ours android-apk/dist/EcosisUnicorn.apk
              git add android-apk/dist/EcosisUnicorn.apk
              GIT_EDITOR=true git rebase --continue || true
            else
              git rebase --abort || true
              exit 1
            fi
          done
          git push origin HEAD:main

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Obtener codigo actualizado
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Descargar APK generado
        uses: actions/download-artifact@v4
        with:
          name: EcosisUnicorn-apk
          path: android-apk/dist

      - name: Subir APK por FTP a InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: /htdocs/
          protocol: ftps
          state-name: .ftp-deploy-sync-state-apk.json
          dangerous-clean-slate: false
          exclude: |
            **/*
            !android-apk/dist/EcosisUnicorn.apk
