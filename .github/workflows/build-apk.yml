name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-apk
        run: gradle assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p android-apk/dist
          cp android-apk/app/build/outputs/apk/debug/app-debug.apk android-apk/dist/EcosisUnicorn.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcosisUnicorn-apk
          path: android-apk/dist/EcosisUnicorn.apk
          if-no-files-found: error

      # Cada build publica (o actualiza) un release de GitHub con el APK y su
      # changelog, tomando versionCode/versionName del build.gradle.kts.
      # Etiqueta: v<versionName> (p. ej. v1.0.19). Si esa etiqueta ya existe
      # pero con otra revisión, se usa v<versionName>-r<versionCode> para no
      # pisar el histórico.
      - name: Publicar release de la APK en GitHub
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VC=$(grep -oP 'versionCode\s*=\s*\K\d+' android-apk/app/build.gradle.kts | head -1)
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android-apk/app/build.gradle.kts | head -1)
          TAG="v${VN}"
          TITLE="EcosisUnicorn v${VN} (Rev. ${VC})"

          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTING=$(gh release view "$TAG" --json name --jq '.name // ""' 2>/dev/null || echo "")
            if [[ -n "$EXISTING" && "$EXISTING" != *"(Rev. ${VC})"* ]]; then
              TAG="${TAG}-r${VC}"
            fi
          fi

          python3 - "$VC" "$VN" > /tmp/release-notes.md <<'PY'
          import json, sys
          vc, vn = int(sys.argv[1]), sys.argv[2]
          try:
              data = json.load(open('android-apk/dist/version.json', encoding='utf-8'))
          except Exception:
              data = {}
          entry = next((c for c in data.get('changes', []) if int(c.get('versionCode', -1)) == vc), None)
          out = [f"**EcosisUnicorn v{vn} · Revisión {vc}**"]
          if entry:
              if entry.get('summary'):
                  out += ["", str(entry['summary'])]
              if entry.get('changelog'):
                  out += ["", f"> {entry['changelog']}"]
              for title, key in (("Novedades", "novedades"), ("Correcciones", "correcciones")):
                  items = entry.get(key) or []
                  if items:
                      out += ["", f"### {title}"] + [f"- {i}" for i in items]
              if entry.get('date'):
                  out += ["", f"_Fecha: {entry['date']}_"]
          out += ["", "---", "_Release publicado automáticamente por el workflow **Build Android APK**._"]
          print("\n".join(out))
          PY

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" android-apk/dist/EcosisUnicorn.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/release-notes.md --latest || \
              gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" android-apk/dist/EcosisUnicorn.apk \
              --title "$TITLE" --notes-file /tmp/release-notes.md --latest --target "$GITHUB_SHA"
          fi

          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/EcosisUnicorn.apk"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Release publicado: $TITLE -> $URL"

      # version.json (lo leen la web y el comprobador de la APK) queda apuntando
      # al APK del release, de modo que cada revisión queda archivada en GitHub.
      - name: Apuntar version.json al APK del release
        if: steps.release.outputs.url != ''
        run: |
          jq --arg url "${{ steps.release.outputs.url }}" '.apkUrl = $url' android-apk/dist/version.json > version.json.tmp
          mv version.json.tmp android-apk/dist/version.json
          grep -q 'releases/download' android-apk/dist/version.json
          echo "apkUrl -> ${{ steps.release.outputs.url }}"

      - name: Commit updated APK to dist
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f android-apk/dist/EcosisUnicorn.apk android-apk/dist/rates.json android-apk/dist/rate-usd.json android-apk/dist/version.json
          if git diff --cached --quiet; then
            echo "No APK changes to commit"
            exit 0
          fi
          git commit -m "Actualizar APK dist y snapshots de tasas [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main; then
              break
            fi
            if git status --porcelain | grep -q "android-apk/dist/EcosisUnicorn.apk"; then
              git checkout --ours android-apk/dist/EcosisUnicorn.apk
              git add android-apk/dist/EcosisUnicorn.apk
              GIT_EDITOR=true git rebase --continue || true
            else
              git rebase --abort || true
              exit 1
            fi
          done
          git push origin HEAD:main

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Obtener codigo actualizado
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Descargar APK generado
        uses: actions/download-artifact@v4
        with:
          name: EcosisUnicorn-apk
          path: android-apk/dist

      - name: Subir APK por FTP a InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: /htdocs/
          protocol: ftps
          state-name: .ftp-deploy-sync-state-apk.json
          dangerous-clean-slate: false
          exclude: |
            **/*
            !android-apk/dist/EcosisUnicorn.apk
